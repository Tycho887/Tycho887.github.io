image: alpine:latest

# Define stages clearly
stages:
  - deploy

pages:
  stage: deploy
  tags:
    - laptop
  script:
    - mkdir -p public
    # Using specific filenames to ensure the homepage works
    - cp main.html public/index.html || echo "main.html not found"
    - cp agent.html public/ || echo "agent.html not found"
    - cp emails.json public/ || echo "emails.json not found"
    - cp documents.json public/ || echo "documents.json not found"
    - "[ -d documents ] && cp -r documents/ public/ || echo 'No documents folder'"
    - ls -R public  # Debug: Verify structure in the log
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"