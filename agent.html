<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Boks Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --eboks-blue: #c62828;
            --bg: #f5f5f5;
            --surface: #ffffff;
            --text: #333333;
            --border: #d9d9d9;
            --chat-user: #e3f2fd;
            --chat-bot: #f5f5f5;
            --header-bg: #eeeeee;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }

        .header { background: var(--eboks-blue); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: bold; }
        .nav-link { color: rgba(255,255,255,0.8); text-decoration: none; margin-left: 20px; font-size: 14px; }
        .nav-link:hover { color: white; text-decoration: underline; }

        .container { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 350px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #fafafa; }
        .sidebar-title { font-weight: 600; font-size: 16px; margin-bottom: 5px; }
        .sidebar-subtitle { font-size: 12px; color: #666; }
        
        .document-list { flex: 1; overflow-y: auto; padding: 0; }
        
        .list-section {
            background: var(--header-bg);
            padding: 8px 15px;
            font-size: 11px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0e0e0;
            border-top: 1px solid #e0e0e0;
        }
        .list-section:first-child { border-top: none; }

        .doc-item {
            display: flex;
            gap: 10px;
            padding: 12px 15px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }
        .doc-item:hover { background: #f9f9f9; }
        .doc-item.selected { background: #fff0f0; border-left: 4px solid var(--eboks-blue); }
        
        .doc-checkbox { margin-top: 3px; cursor: pointer; }
        .doc-content { font-size: 13px; flex: 1; }
        .doc-sender { font-weight: 600; color: #333; display: flex; justify-content: space-between; }
        .doc-subject { color: #555; margin-top: 2px; }
        .doc-date { font-size: 11px; color: #999; font-weight: 400; }
        
        .type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #eee; color: #555; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: white; position: relative; }
        
        .chat-history { 
            flex: 1; 
            overflow-y: auto; 
            padding: 30px; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            scroll-behavior: smooth;
        }

        .message { max-width: 80%; line-height: 1.5; font-size: 15px; position: relative; }
        .message.user { align-self: flex-end; background: var(--chat-user); padding: 12px 18px; border-radius: 12px 12px 0 12px; color: #0d47a1; }
        .message.bot { align-self: flex-start; background: var(--chat-bot); padding: 12px 18px; border-radius: 12px 12px 12px 0; color: #333; }
        
        /* --- NEW: Markdown Styles --- */
        .message.bot p { margin: 0 0 10px 0; }
        .message.bot p:last-child { margin-bottom: 0; }
        .message.bot ul, .message.bot ol { margin: 5px 0 10px 20px; padding: 0; }
        .message.bot li { margin-bottom: 5px; }
        .message.bot strong { font-weight: 700; color: #000; }
        .message.bot h1, .message.bot h2, .message.bot h3 { font-size: 16px; margin: 10px 0 5px 0; font-weight: 700; }
        .message.bot code { background: rgba(0,0,0,0.05); padding: 2px 4px; border-radius: 3px; font-family: monospace; }
        /* ---------------------------- */

        .agent-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--eboks-blue);
            background: #fff0f0;
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #ffcdd2;
            margin-bottom: 8px;
            font-family: monospace;
        }

        .input-area { 
            padding: 20px; 
            border-top: 1px solid var(--border); 
            background: #fff;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
            z-index: 100;
        }

        textarea { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 6px; resize: none; height: 50px; font-family: inherit; }
        textarea:focus { outline: 2px solid var(--eboks-blue); border-color: transparent; }

        button.send-btn { background: var(--eboks-blue); color: white; border: none; border-radius: 6px; width: 50px; height: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        button.send-btn:hover { background: #b71c1c; }
        button.send-btn:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">e-Boks <span style="font-weight:300; opacity:0.8;">| Agent</span></div>
    <div><a href="index.html" class="nav-link">← Back to Inbox</a></div>
</div>

<div class="container">
    <!-- <div class="api-overlay">
        <input type="password" id="apiKey" placeholder="Gemini API Key" style="border:none; background:transparent; outline:none; width: 120px;">
    </div> -->

    <div class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Context Library</div>
            <div class="sidebar-subtitle">Select items to analyze.</div>
        </div>
        <div class="document-list" id="documentList"></div>
    </div>

    <div class="chat-area">
        <div class="chat-history" id="chatHistory">
            <div class="message bot">
                Hello. I can help you analyze your inbox and documents. Select items from the left to give me context.
            </div>
        </div>

        <div class="input-area">
            <textarea id="userPrompt" placeholder="Ask a question..."></textarea>
            <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
    const MODEL_NAME = "gemini-2.5-flash";
    let appData = { emails: [], docs: [] };

    async function init() {
        try {
            const [emailRes, docRes] = await Promise.all([fetch('emails.json'), fetch('documents.json')]);
            if(emailRes.ok) appData.emails = await emailRes.json();
            if(docRes.ok) appData.docs = await docRes.json();
            renderSidebar();
        } catch (e) {
            console.error(e);
            alert("Error loading data. Ensure you are running on a local server.");
        }
    }

    function renderSidebar() {
        const container = document.getElementById('documentList');
        let html = '';
        if (appData.emails.length > 0) {
            html += `<div class="list-section">Inbox</div>`;
            html += appData.emails.map(item => createItemHtml(item, 'email')).join('');
        }
        if (appData.docs.length > 0) {
            html += `<div class="list-section">My Documents</div>`;
            html += appData.docs.map(item => createItemHtml(item, 'doc')).join('');
        }
        container.innerHTML = html;
    }

    function createItemHtml(item, type) {
        const uniqueId = `${type}-${item.id}`;
        const title = type === 'email' ? item.subject : item.title;
        const badge = type === 'doc' ? '<span class="type-badge">FILE</span>' : '';
        return `
            <div class="doc-item" onclick="toggleSelection(this, '${uniqueId}')">
                <input type="checkbox" class="doc-checkbox" id="chk-${uniqueId}" data-type="${type}" data-id="${item.id}">
                <div class="doc-content">
                    <div class="doc-sender">${item.sender} ${badge}</div>
                    <div class="doc-subject">${title}</div>
                    <div class="doc-date">${item.date}</div>
                </div>
            </div>`;
    }

    function toggleSelection(div, uniqueId) {
        const checkbox = document.getElementById(`chk-${uniqueId}`);
        if (event.target !== checkbox) checkbox.checked = !checkbox.checked;
        if(checkbox.checked) div.classList.add('selected'); else div.classList.remove('selected');
    }

    async function getSelectedContext() {
        const checkboxes = Array.from(document.querySelectorAll('.doc-checkbox:checked'));
        if (checkboxes.length === 0) return null;
        const promises = checkboxes.map(async (cb) => {
            const type = cb.dataset.type;
            const id = parseInt(cb.dataset.id);
            if (type === 'email') {
                const email = appData.emails.find(e => e.id === id);
                return `--- EMAIL START ---\nFrom: ${email.sender}\nDate: ${email.date}\nSubject: ${email.subject}\nContent: ${email.content}\n--- EMAIL END ---`;
            } else if (type === 'doc') {
                const doc = appData.docs.find(d => d.id === id);
                try {
                    const res = await fetch(`documents/${doc.filename}`);
                    const text = await res.text();
                    return `--- DOCUMENT START ---\nFilename: ${doc.filename}\nTitle: ${doc.title}\nContent: ${text}\n--- DOCUMENT END ---`;
                } catch (err) { return `--- DOCUMENT ERROR ---\nCould not load content for ${doc.filename}\n--- END ---`; }
            }
        });
        const results = await Promise.all(promises);
        return results.join('\n\n');
    }

    async function sendMessage() {
        const inputField = document.getElementById('userPrompt');
        const text = inputField.value.trim();
        // const apiKey = document.getElementById('apiKey').value;
        const sendBtn = document.getElementById('sendBtn');

        if (!text) return;
        // if (!apiKey) { alert("Please enter API Key top right"); return; }

        appendMessage('user', text);
        inputField.value = '';
        sendBtn.disabled = true;

        const loadingId = 'loading-' + Date.now();
        appendMessage('bot', 'Analyzing...', false, loadingId);

        try {
            const contextData = await getSelectedContext();
            let systemPrompt = `You are an intelligent e-Boks assistant.
            INSTRUCTIONS:
            1. Answer based ONLY on the User Documents provided below.
            2. Use Markdown formatting (lists, bolding, headers) to make the response structured and easy to read.
            3. If you need external data, output [[ACTION: CHECK_STATUS]].
            
            USER DOCUMENTS:
            ${contextData ? contextData : "No documents selected."}`;

            // const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;

            // const response = await fetch(url, {
            //     method: "POST",
            //     headers: { "Content-Type": "application/json" },
            //     body: JSON.stringify({
            //         system_instruction: { parts: [{ text: systemPrompt }] },
            //         contents: [{ role: "user", parts: [{ text: text }] }]
            //     })
            // });

            const workerUrl = "https://gemini-proxy.michaelrj03.workers.dev"; // Get this from your Worker dashboard
            
            const response = await fetch(workerUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    // formatting matched to what the proxy expects
                    system_instruction: { parts: [{ text: systemPrompt }] },
                    contents: [{ role: "user", parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            const rawText = data.candidates[0].content.parts[0].text;
            document.getElementById(loadingId).remove();

            // --- NEW: Parse Markdown and replace Actions ---
            let htmlContent = marked.parse(rawText);
            
            htmlContent = htmlContent.replace(/\[\[ACTION: (.*?)\]\]/g, (match, action) => {
                return `<div class="agent-action">⚡ Tool: ${action}</div>`;
            });
            // ----------------------------------------------

            appendMessage('bot', htmlContent, true);

        } catch (err) {
            if(document.getElementById(loadingId)) document.getElementById(loadingId).innerText = "Error: " + err.message;
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(role, content, isHtml = false, id = null) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        if(id) div.id = id;
        if (isHtml) div.innerHTML = content; else div.innerText = content;
        document.getElementById('chatHistory').appendChild(div);
        div.scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('userPrompt').addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    init();
</script>

</body>
</html>
